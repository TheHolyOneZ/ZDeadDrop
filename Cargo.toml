[workspace]
resolver = "2"
members = [
    "crates/zdd-core",
    "crates/zdd-seal",
    "src-tauri",
    "crates/zdd-store",
    "crates/zdd-import",
    "crates/zdd-cli",
    "crates/zdd-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["TheHolyOneZ"]
repository = "https://github.com/TheHolyOneZ/ZDeadDrop"

[workspace.dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
blake3           = "1.8"
sha2             = "0.10"
hkdf             = "0.12"
argon2           = { version = "0.5", features = ["std"] }

x25519-dalek  = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }

zeroize = { version = "1.8", features = ["derive"] }
subtle  = "2.6"
rand    = "0.8"
rand_core = "0.6"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
base64     = "0.23"

thiserror = "2"
tracing   = "0.1"

zdd-core = { path = "crates/zdd-core" }
zdd-seal = { path = "crates/zdd-seal" }
zdd-store = { path = "crates/zdd-store" }
zdd-import = { path = "crates/zdd-import" }

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
panic     = "abort"
strip     = true

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
