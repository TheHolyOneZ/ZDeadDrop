[package]
name        = "zdd-relay"
description = "The ZDeadDrop coordination relay: an untrusted, auditable witness to whether someone is still checking in."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "zdd_relay"
path = "src/lib.rs"

[[bin]]
name = "zdd-relay"
path = "src/main.rs"

[dependencies]
zdd-core.workspace = true

axum     = "0.8"
rand.workspace = true
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower    = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
rusqlite = { version = "0.37", features = ["bundled"] }

serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
tracing.workspace    = true
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
blake3.workspace     = true
lettre   = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "builder"] }
reqwest  = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
