name: Build ZDeadDrop (Windows + Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build-windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests (on real Windows)
        run: cargo test --workspace --locked

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: Build — zdd command line
        shell: pwsh
        run: |
          cargo build --release --locked -p zdd-cli --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force cli | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/zdd.exe cli/zdd-windows-x64.exe

      - name: List bundle output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== All bundle files ==="
          Get-ChildItem -Recurse target -Include *.exe,*.msi -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Bundle directory tree ==="
          Get-ChildItem -Recurse target -Directory -Filter bundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            cli/*
          if-no-files-found: error
          retention-days: 30


  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev \
            patchelf rpm

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"
          key: linux-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build — deb + rpm
        run: pnpm tauri build --bundles deb,rpm

      - name: Build — zdd command line and relay
        run: |
          cargo build --release --locked -p zdd-cli -p zdd-relay
          mkdir -p cli
          cp target/release/zdd cli/zdd-linux-x64
          cp target/release/zdd-relay cli/zdd-relay-linux-x64

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find target -type f \( -name '*.deb' -o -name '*.rpm' \) 2>/dev/null || echo "(nothing found)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            cli/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building draft for v$VERSION"

      - name: Refuse to touch an already-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"$TAG\" and .draft==false)] | length")
          if [ "$PUBLISHED" != "0" ]; then
            echo "::error::A published release $TAG already exists. Bump the version in src-tauri/tauri.conf.json, package.json and the root Cargo.toml before building."
            exit 1
          fi

      - name: Remove any previous draft for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\" and .draft==true) | .id"); do
            echo "Deleting stale draft release $ID"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten installers into release/
        run: |
          mkdir -p release
          find dist -type f \( \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name 'zdd-*' \
          \) -exec cp {} release/ \;
          chmod +x release/zdd-*-linux-* 2>/dev/null || true
          (cd release && sha256sum * > SHA256SUMS.txt)
          echo "=== release/ ==="
          ls -lah release/
          test -n "$(ls -A release)" || { echo "::error::No installers found"; exit 1; }

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ZDeadDrop ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: false
          files: release/*
          body: |
            **Draft.** Attached: the desktop app for Windows (.exe installer,
            .msi) and Linux (.deb, .rpm); the `zdd` command line for Windows
            and Linux, which recipients use to open what was left to them; the
            relay for Linux; and SHA256SUMS.txt.
